# pricing.yaml -- cost per 1K tokens
# cache_write is 1.25x input (Anthropic 5m TTL), cache_read is 0.1x input.
# Set both to 0 for providers without prompt caching.
anthropic:
  claude-opus-4-6:   { input: 0.015, output: 0.075, cache_write: 0.01875, cache_read: 0.0015 }
  claude-sonnet-4-5: { input: 0.003, output: 0.015, cache_write: 0.00375, cache_read: 0.0003 }
  claude-haiku-4-5:  { input: 0.0008, output: 0.004, cache_write: 0.001,   cache_read: 0.00008 }
openai:
  codex-max: { input: 0.01, output: 0.03, cache_write: 0, cache_read: 0 }
google:
  gemini-3-pro: { input: 0.007, output: 0.021, cache_write: 0, cache_read: 0 }
