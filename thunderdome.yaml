  # NO-REVIEWER BASELINE for the writer+reviewer pairings above. Phase 1 is
  # byte-identical to theirs; the only difference is that no review phase runs,
  # so any delta isolates the review phase itself. Without this arm we can only
  # say which reviewer is better, not whether reviewing helps at all. Uses only
  # the 5090, so it can run while a reviewer model occupies the 3090.
  - name: qwopus-solo
