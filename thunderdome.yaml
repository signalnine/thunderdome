  # (llama.cpp dual-arch build86, 3090) reviews. $0 end to end, nothing leaves
  # the box. Needs q27 on :8080 and Ornith-9B on :8083.
  - name: qwopus-ornith9b-verify
    adapter: ./adapters/qwopus-ornith9b-verify/adapter.sh
    image: thunderdome/claude-code:latest
    env: {}

  # Same local writer, but the reviewer seat goes to Gemma 4 26B-A4B on the 3090.
  # Gemma is a weak coding agent (49.4% solo) yet the only local model here that
  # discriminates as a judge, and reviewing is judging. Requires the 3090 server
  # up on :8083 with thinking OFF -- see the adapter header. Still $0/task.
  - name: qwopus-gemma4-verify
    adapter: ./adapters/qwopus-gemma4-verify/adapter.sh
    image: thunderdome/claude-code:latest
    env: {}

  # Model-diversity CONTROL for the reviewer seat: qwopus writer reviewed by the
  # VANILLA Qwen3.6-27B it was fine-tuned from, so writer and reviewer are near
  # siblings with correlated blind spots. Tests whether a review phase helps
  # because of fresh context or because of genuine model diversity. Needs vanilla
  # on the 3090 via q27-server-w8 :8084 + a second bridge on :8085 -- see the
  # adapter header. Still $0/task.
  - name: qwopus-qwen-verify
    adapter: ./adapters/qwopus-qwen-verify/adapter.sh
    image: thunderdome/claude-code:latest
    env: {}

  # Local writer + cheap CLOUD reviewer. Luna is 83.9% solo but splits 94.1 std /
  # 72.7 hard; reviewing is standard-suite work, so the profile may fit the seat
  # better than the rank suggests. No shim needed -- OpenRouter serves Anthropic
  # /v1/messages and accepts x-api-key.
  - name: qwopus-luna-verify
    adapter: ./adapters/qwopus-luna-verify/adapter.sh
    image: thunderdome/claude-code:latest
    env:
